[project]
name = "baseera-platform"
version = "0.1.0"
description = "BASEERA enterprise analytics and decision-support platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "authlib==1.8.0",
  "duckdb==1.5.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph==1.2.11",
  "networkx==3.6.1",
  "numpy==2.5.2",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "polars==1.44.1",
  "psycopg[binary]==3.3.5",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "rq==2.12.0",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "sqlalchemy==2.0.52",
  "statsmodels==0.15.0",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
  "xlsxwriter==3.2.9",
  "weasyprint==69.0",
  "anthropic==1.8.0",
]

[project.optional-dependencies]
advanced = [
  "ortools==9.15.6755",
  "simpy==4.1.2"
]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.6"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The analyst team writes bilingual (Arabic/English) business prose; splitting each
# sentence across lines to fit 100 columns makes the copy harder to review and translate.
"services/api/baseera/agents/**" = ["E501"]
"tests/agents/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
