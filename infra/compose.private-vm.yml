name: baseera

services:
  postgres:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
